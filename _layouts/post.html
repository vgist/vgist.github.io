---
layout: default
---

{%-include back_link.html-%}

<article>
  <p class="post-meta">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: site.theme_config.date_format }}</time>
  </p>
  
  <h1>{{ page.title }}</h1>

  {{ content }}
</article>

<script>
  document.querySelectorAll('article img').forEach(function(img) {
    img.loading = 'lazy';
    img.decoding = 'async';
  });
</script>
