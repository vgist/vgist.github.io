<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "zh-CN" }}" a="{{ site.theme_config.appearance | default: "auto" }}">
  {%- include head.html -%}
  <body a="{{ site.theme_config.appearance | default: "auto" }}">
    <main class="page-content" aria-label="Content">
      <div class="w">
        {{ content }}
      </div>
    </main>

    {% if page.custom_js %}
      {% for js_file in page.custom_js %}
        <script src="{{ '/assets/js/' | append: js_file | append: '.js' | relative_url }}"></script>
      {% endfor %}
    {% endif %}
  </body>
</html>
